<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Turnos | srvictor.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2370/2370264.png">
    
    <style>
        .card-shadow { transition: all 0.3s ease; }
        .card-shadow:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <nav class="bg-slate-800 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center font-bold">V</div>
                <span class="font-bold tracking-tight hidden sm:block">srvictor.com</span>
            </div>
            <div class="flex items-center gap-3">
                <label for="fechaFiltro" class="text-xs text-slate-400 font-medium uppercase hidden md:block">Fecha:</label>
                <input type="date" id="fechaFiltro" 
                       class="bg-slate-700 border-none rounded-md px-3 py-1.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 md:p-6">
        <header class="mb-8">
            <h2 class="text-2xl font-extrabold text-slate-800">Estado de Puestos</h2>
            <p class="text-slate-500 text-sm">Consulta en tiempo real los oficiales asignados por sierra.</p>
        </header>

        <div id="gridSierras" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <div class="col-span-full text-center py-20">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-300 border-t-blue-600 mb-4"></div>
                <p class="text-slate-500 font-medium">Sincronizando con Supabase...</p>
            </div>
        </div>
    </main>

    <script>
        // === CONFIGURACIÓN DE TU PROYECTO ===
        const SUPABASE_URL = 'https://eciqadbqzwpwxibbcggz.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjaXFhZGJxendwd3hpYmJjZ2d6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5OTI1MTgsImV4cCI6MjA4OTU2ODUxOH0.PcXy8YlpktbJXKmL0jt0U9cjrH2TlIPuS7GK263Xio4';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        const grid = document.getElementById('gridSierras');
        const inputFecha = document.getElementById('fechaFiltro');

        // Puestos requeridos
        const PUESTOS_LISTA = ["Sierra 1", "Sierra 2", "Sierra 3", "Sierra 4", "Sierra 5", "Sierra 6", "Sierra 7", "P1.7", "P2", "Sierra 8"];

        // Hoy por defecto
        inputFecha.value = new Date().toISOString().split('T')[0];

        async function cargarDatos() {
            grid.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400">Consultando registros...</div>';
            
            try {
                const { data, error } = await _supabase
                    .from('historial_relevos')
                    .select('*')
                    .eq('fecha', inputFecha.value);

                if (error) throw error;
                renderizar(data);
            } catch (err) {
                grid.innerHTML = `<div class="col-span-full bg-red-50 text-red-600 p-4 rounded-lg border border-red-200">Error: ${err.message}</div>`;
            }
        }

        function renderizar(datos) {
            grid.innerHTML = '';
            
            PUESTOS_LISTA.forEach(puesto => {
                // Filtramos por nombresierra (todo en minúscula como pediste)
                const reg = datos.find(d => d.nombresierra === puesto);
                
                const card = document.createElement('div');
                card.className = `card-shadow bg-white rounded-2xl p-5 border-t-4 shadow-sm border ${reg ? 'border-t-green-500 border-slate-200' : 'border-t-slate-300 border-slate-100 opacity-80'}`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-xs font-black uppercase tracking-wider text-slate-400">${puesto}</span>
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${reg ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500'}">
                            ${reg ? 'Activo' : 'Libre'}
                        </span>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 truncate">
                        ${reg ? reg.nombreoficial : 'Sin Oficial'}
                    </h3>
                    <div class="mt-4 space-y-2">
                        <div class="flex items-center gap-2 text-xs">
                            <span class="w-16 text-slate-400">Entrada:</span>
                            <span class="font-semibold text-slate-600">${reg?.horaentrada || '--:--'}</span>
                        </div>
                        <div class="flex items-center gap-2 text-xs">
                            <span class="w-16 text-slate-400">Salida:</span>
                            <span class="font-semibold text-slate-600">${reg?.horasalida || 'En curso'}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        inputFecha.addEventListener('change', cargarDatos);
        window.addEventListener('load', cargarDatos);
    </script>
</body>
</html>
